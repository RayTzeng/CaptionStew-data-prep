ica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#0f172a">JamendoMaxCaps</text><path d="M210,334 C262,334 250,196 300,196" fill="none" stroke="#d946ef" stroke-width="2" opacity="0.7"/><rect x="30" y="320" width="180" height="28" rx="14.0" fill="#ffffff" stroke="#d946ef" stroke-width="2"/><text x="120.0" y="339.0" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#0f172a">ParaSpeechCaps</text><circle cx="300" cy="196" r="7" fill="#0f172a"/><path d="M300,196 L330,196" stroke="#0f172a" stroke-width="2"/><text x="345" y="186" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="64" fill="#0f172a" letter-spacing="-1.5">CaptionStew</text><text x="345" y="226" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#334155">Unified data preparation for</text><text x="345" y="254" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#334155">diverse-domain audio captioning</text><text x="345" y="294" text-anchor="start" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#64748b">10.6M captions  ·  9.1M clips  ·  34.8k hours</text><rect x="812" y="24" width="440" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="812" y="24" width="5" height="60" rx="2.5" fill="#14b8a6"/><text x="828" y="48" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#14b8a6">AUDIOCAPS</text><text x="828" y="68.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">“waves break nearby”</text><rect x="812" y="93.55" width="440" height="77" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="812" y="93.55" width="5" height="77" rx="2.5" fill="#d946ef"/><text x="828" y="117.55" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#d946ef">PARASPEECHCAPS</text><text x="828" y="137.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">“A husky-voiced Irish man speaks with a deep, clean tone in</text><text x="828" y="155.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">a measured speed.”</text><rect x="812" y="180.64999999999998" width="440" height="77" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="812" y="180.64999999999998" width="5" height="77" rx="2.5" fill="#f59e0b"/><text x="828" y="204.64999999999998" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#f59e0b">MUSICCAPS</text><text x="828" y="224.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">“Someone is beatboxing a reggaeton beat. In the background</text><text x="828" y="242.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">you can hear the crowd clapping and cheering.”</text><rect x="812" y="267.75" width="440" height="95" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="812" y="267.75" width="5" height="95" rx="2.5" fill="#f59e0b"/><text x="828" y="291.75" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#f59e0b">JAMENDOMAXCAPS</text><text x="828" y="311.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">“The music is instrumental with a jazz genre, featuring a</text><text x="828" y="329.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">cool mood. It has a time signature of 4/4 and a tempo of</text><text x="828" y="346.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">69.77 bpm.”</text></svg>