-domain audio captioning</text><text x="640.0" y="258" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#64748b">10.6M captions  ·  9.1M clips  ·  34.8k hours</text><rect x="24" y="22" width="300" height="59" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="24" y="22" width="5" height="59" rx="2.5" fill="#14b8a6"/><text x="40" y="46" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#14b8a6">AUDIOCAPS</text><text x="40" y="66.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">“waves break nearby”</text><rect x="24" y="90.875" width="300" height="93" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="24" y="90.875" width="5" height="93" rx="2.5" fill="#f59e0b"/><text x="40" y="114.875" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#f59e0b">MUSICCAPS</text><text x="40" y="134.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">“Someone is beatboxing a reggaeton beat.</text><text x="40" y="151.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">In the background you can hear the crowd</text><text x="40" y="168.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">clapping and cheering.”</text><rect x="24" y="193.5" width="300" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="24" y="193.5" width="5" height="76" rx="2.5" fill="#14b8a6"/><text x="40" y="217.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#14b8a6">WAVCAPS</text><text x="40" y="237.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">“Telephone bells ring in the</text><text x="40" y="254.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">background.”</text><rect x="956" y="22" width="300" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="956" y="22" width="5" height="76" rx="2.5" fill="#d946ef"/><text x="972" y="46" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#d946ef">PARASPEECHCAPS</text><text x="972" y="66.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">“A husky-voiced Irish man speaks with a</text><text x="972" y="82.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">deep, clean tone in a measured speed.”</text><rect x="956" y="107.75" width="300" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="956" y="107.75" width="5" height="110" rx="2.5" fill="#f59e0b"/><text x="972" y="131.75" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#f59e0b">JAMENDOMAXCAPS</text><text x="972" y="151.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">“The music is instrumental with a jazz</text><text x="972" y="168.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">genre, featuring a cool mood. It has a</text><text x="972" y="185.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">time signature of 4/4 and a tempo of</text><text x="972" y="202.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">69.77 bpm.”</text><rect x="956" y="227.25" width="300" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="956" y="227.25" width="5" height="76" rx="2.5" fill="#14b8a6"/><text x="972" y="251.25" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#14b8a6">AUDIOSETCAPS</text><text x="972" y="271.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">“A joyful man emits hearty laughter,</text><text x="972" y="288.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155">followed by the sound of running water.”</text><text x="640.0" y="390" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2" fill="#64748b">BUILT FROM EIGHT OPEN CAPTION DATASETS</text><rect x="210.51" y="402" width="90" height="26" rx="13.0" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/><text x="255.5" y="419.7" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#0f172a">AudioCaps</text><rect x="310.52" y="402" width="69" height="26" rx="13.0" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/><text x="345.2" y="419.7" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#0f172a">Clotho</text><rect x="389.86" y="402" width="76" height="26" rx="13.0" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/><text x="428.0" y="419.7" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#0f172a">WavCaps</text><rect x="476.09000000000003" y="402" width="111" height="26" rx="13.0" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/><text x="531.4" y="419.7" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#0f172a">AudioSetCaps</text><rect x="596.77" y="402" width="104" height="26" rx="13.0" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/><text x="648.7" y="419.7" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#0f172a">FusionAudio<