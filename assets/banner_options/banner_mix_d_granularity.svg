ize="11" letter-spacing="0.8" fill="#f59e0b">MUSICCAPS</text><text x="648" y="295.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">“Someone is beatboxing a reggaeton beat. In the background you can hear the crowd</text><text x="648" y="312.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">clapping and cheering.”</text><rect x="632" y="333.20000000000005" width="620" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="632" y="333.20000000000005" width="5" height="74" rx="2.5" fill="#f59e0b"/><text x="648" y="357.20000000000005" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#f59e0b">JAMENDOMAXCAPS</text><text x="648" y="377.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">“The music is instrumental with a jazz genre, featuring a cool mood. It has a time signature</text><text x="648" y="393.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">of 4/4 and a tempo of 69.77 bpm.”</text></svg>