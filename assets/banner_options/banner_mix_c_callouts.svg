" y1="236.60000000000002" x2="580" y2="300" stroke="#d946ef" stroke-width="2" stroke-dasharray="3 3"/><circle cx="580" cy="300" r="5" fill="#d946ef"/><g transform="translate(540,146)"><rect x="0" y="0" width="240" height="91" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="0" y="0" width="5" height="91" rx="2.5" fill="#d946ef"/><text x="16" y="24" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#d946ef">PARASPEECHCAPS</text><text x="16" y="44.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">“A husky-voiced Irish man speaks</text><text x="16" y="60.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">with a deep, clean tone in a</text><text x="16" y="76.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">measured speed.”</text></g><line x1="830" y1="300" x2="830" y2="323.2" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/><circle cx="830" cy="300" r="5" fill="#f59e0b"/><g transform="translate(790,323.2)"><rect x="0" y="0" width="240" height="107" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="0" y="0" width="5" height="107" rx="2.5" fill="#f59e0b"/><text x="16" y="24" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#f59e0b">MUSICCAPS</text><text x="16" y="44.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">“Someone is beatboxing a</text><text x="16" y="60.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">reggaeton beat. In the</text><text x="16" y="76.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">background you can hear the</text><text x="16" y="92.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">crowd clapping and cheering.”</text></g><line x1="1040" y1="236.60000000000002" x2="1040" y2="300" stroke="#14b8a6" stroke-width="2" stroke-dasharray="3 3"/><circle cx="1040" cy="300" r="5" fill="#14b8a6"/><g transform="translate(1000,146)"><rect x="0" y="0" width="240" height="91" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="0" y="0" width="5" height="91" rx="2.5" fill="#14b8a6"/><text x="16" y="24" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="0.8" fill="#14b8a6">AUDIOSETCAPS</text><text x="16" y="44.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">“A joyful man emits hearty</text><text x="16" y="60.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">laughter, followed by the sound</text><text x="16" y="76.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155">of running water.”</text></g></svg>